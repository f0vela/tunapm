{{define "clients"}}
<div class="sec-head"><h1>Clientes</h1><a class="btn small primary" href="/clients/new">+ Nuevo</a></div>
{{if not .Data}}<p class="empty">Sin clientes.</p>{{end}}
<ul class="rows">
{{range .Data}}<li class="row"><a class="grow" href="/clients/{{.ID}}"><strong>{{.Name}}</strong><small>{{.Company}}</small></a></li>{{end}}
</ul>
{{end}}
