{{define "layout"}}<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f6f7f8">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>{{.Title}} · Tuna</title>
<link rel="manifest" href="{{asset "manifest.json"}}">
<link rel="icon" href="{{asset "icon.svg"}}" type="image/svg+xml">
<link rel="apple-touch-icon" href="{{asset "icon.svg"}}">
<link rel="stylesheet" href="{{asset "app.css"}}">
<script src="{{asset "theme.js"}}"></script>
</head>
<body>
<header class="top">
  <a class="brand" href="/">tuna<b>pm</b></a>
  <label class="theme"><span class="sr">Tema de colores</span>
    <select id="theme" autocomplete="off">
      <option value="auto">Automático</option>
      <option value="light">Claro</option>
      <option value="dark">Oscuro</option>
      <option value="dracula">Dracula</option>
      <option value="catppuccin-mocha">Catppuccin Mocha</option>
      <option value="catppuccin-macchiato">Catppuccin Macchiato</option>
      <option value="catppuccin-latte">Catppuccin Latte</option>
      <option value="rose-pine">Rosé Pine</option>
      <option value="rose-pine-moon">Rosé Pine Moon</option>
      <option value="rose-pine-dawn">Rosé Pine Dawn</option>
      <option value="tokyo-night">Tokyo Night</option>
      <option value="gruvbox">Gruvbox</option>
      <option value="nord">Nord</option>
      <option value="solarized-light">Solarized Light</option>
    </select></label>
  {{if .Auth}}{{if ne .Nav ""}}<form method="post" action="/logout"><button class="link" type="submit">Salir</button></form>{{end}}{{end}}
</header>
<main>
  {{if .Flash}}<div class="flash">{{.Flash}}</div>{{end}}
  {{if .Error}}<div class="error">{{.Error}}</div>{{end}}
  {{.Content}}
</main>
{{if ne .Nav ""}}
<nav class="tabs">
  <a href="/" {{if eq .Nav "inicio"}}class="on"{{end}}>Inicio</a>
  <a href="/tasks" {{if eq .Nav "tareas"}}class="on"{{end}}>Tareas</a>
  <a href="/projects" {{if eq .Nav "proyectos"}}class="on"{{end}}>Proyectos</a>
  <a href="/payments" {{if eq .Nav "cuotas"}}class="on"{{end}}>Cuotas</a>
  <a href="/clients" {{if eq .Nav "clientes"}}class="on"{{end}}>Clientes</a>
</nav>
{{end}}
</body>
</html>{{end}}
